env:
  APP_NAME: wemplate
  ENTRY_POINT: main.py

name: Windows Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write     # needed only for the tag -> release step
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install PyInstaller + project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build EXE with PyInstaller
        run: >
          pyinstaller --onefile --windowed --clean --noconfirm
          --name "${{ env.APP_NAME }}" "${{ env.ENTRY_POINT }}"

      - name: Verify the EXE was produced
        run: |
          Get-ChildItem dist
          if (-not (Test-Path "dist/${{ env.APP_NAME }}.exe")) {
            throw "Build failed: ${{ env.APP_NAME }}.exe was not created"
          }

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-x64
          path: dist/${{ env.APP_NAME }}.exe
          if-no-files-found: error

      - name: Attach EXE to GitHub Release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP_NAME }}.exe
